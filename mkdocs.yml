site_name: Silicon to Cloud
site_description: From a single keypress to the UI on screen to AI infrastructure — how computers and the internet actually work, layer by layer.
site_author: Gökhan Aşkın
site_url: https://gaskinimbuspro.github.io/silicon-to-cloud/
repo_url: https://github.com/gaskinimbuspro/silicon-to-cloud
repo_name: silicon-to-cloud
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - "1 · Keypress": 01-keypress/index.md
  - "2 · CPU & Assembly": 02-cpu/index.md
  - "3 · Operating system": 03-os/index.md
  - "4 · How a program runs": 04-program/index.md
  - "5 · Networking": 05-network/index.md
  - "6 · DNS, TCP, TLS, HTTP": 06-internet/index.md
  - "7 · Server side": 07-server/index.md
  - "8 · The browser": 08-browser/index.md
  - "9 · Modern infrastructure": 09-infra/index.md
  - "10 · AI infrastructure": 10-ai/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: tr
          name: Türkçe
          build: true
          site_name: Silicon to Cloud
          nav_translations:
            Home: Ana sayfa
            "1 · Keypress": "1 · Tuş basımı"
            "2 · CPU & Assembly": "2 · CPU & Assembly"
            "3 · Operating system": "3 · İşletim sistemi"
            "4 · How a program runs": "4 · Program nasıl çalışır"
            "5 · Networking": "5 · Ağın temelleri"
            "6 · DNS, TCP, TLS, HTTP": "6 · DNS, TCP, TLS, HTTP"
            "7 · Server side": "7 · Sunucu tarafı"
            "8 · The browser": "8 · Tarayıcı"
            "9 · Modern infrastructure": "9 · Modern altyapı"
            "10 · AI infrastructure": "10 · AI altyapısı"
  - glightbox   # click a diagram to zoom
