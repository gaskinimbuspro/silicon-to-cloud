name: Labs

on:
  push:
    branches: [main]
    paths: ["labs/**", ".github/workflows/labs.yml"]
  schedule:
    - cron: "43 4 * * 1"   # weekly: catch labs broken by new images or tools
  workflow_dispatch:

jobs:
  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils strace binutils >/dev/null
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64 && sudo install kind /usr/local/bin/kind
      - name: Run all CI-safe labs
        run: ./labs/run.sh all --ci
